version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      runtime-and-ui:
        patterns:
          - "Avalonia*"
          - "CommunityToolkit*"
    ignore:
      # Avalonia 12 is a major release: it removes the clipboard API we use, changes the theme
      # templates and the render pipeline. Upgrading needs a dedicated branch, the screenshot
      # regression and platform re-verification, so it is a decision, not an inbox item.
      # Patch releases inside 11.x still arrive. See the closed PR #7 for the failure analysis.
      - dependency-name: "Avalonia*"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
