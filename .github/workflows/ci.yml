name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build-test:
    name: build + probe smoke + report
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore AirNet.slnx

      - name: Build (warnings are errors)
        run: dotnet build AirNet.slnx -c Release --no-restore -warnaserror

      # Pure logic only: statistics, classification boundaries, parsers, masking and history.
      - name: Unit tests
        run: dotnet test tests/AirNet.Core.Tests/AirNet.Core.Tests.csproj -c Release --no-build --nologo

      # The self test runs the real probe stack once. It asserts structure, never measured
      # values: a CI runner's network is not this product's target environment.
      - name: Probe self test
        shell: pwsh
        run: |
          $exe = "src/AirNet.App/bin/Release/net10.0/AirNet.exe"
          $report = "$env:RUNNER_TEMP/selftest.txt"
          $process = Start-Process -FilePath $exe -ArgumentList "--selftest", $report -PassThru -NoNewWindow
          if (-not $process.WaitForExit(300000)) {
            $process.Kill()
            throw "self test timed out"
          }
          Get-Content $report

          $text = Get-Content $report -Raw
          $required = @(
            'interface=', 'egress=', 'hasBandwidth=', 'probeMode=', 'avg=', 'jitter=', 'loss=',
            'timingHost=', 'reportChars=', 'reportHasSvg=True', 'reportHasScore=True',
            'reportMasked=192.168.x.x', 'historyRoundTrip=True', 'targetReached=', 'culprit='
          )
          foreach ($token in $required) {
            if ($text -notmatch [regex]::Escape($token)) { throw "self test output is missing: $token" }
          }
          if ($text -match 'error=') { throw "self test reported an error" }

      - name: Site latency CLI smoke
        shell: pwsh
        run: |
          $exe = "src/AirNet.App/bin/Release/net10.0/AirNet.exe"
          $out = "$env:RUNNER_TEMP/sites.txt"
          $process = Start-Process -FilePath $exe -ArgumentList "--sites", $out -PassThru -NoNewWindow
          if (-not $process.WaitForExit(300000)) {
            $process.Kill()
            throw "site latency CLI timed out"
          }
          if (-not (Test-Path $out)) { throw "site latency CLI did not write output" }
          Get-Content $out
          $text = Get-Content $out -Raw
          foreach ($token in 'captured=', 'succeeded=', "`t") {
            if ($text -notmatch [regex]::Escape($token)) { throw "site output is missing: $token" }
          }
          if ($text -match 'error=') { throw "site latency CLI reported an error" }

      - name: Report renders and is self contained
        shell: pwsh
        run: |
          $exe = "src/AirNet.App/bin/Release/net10.0/AirNet.exe"
          $html = "$env:RUNNER_TEMP/report.html"
          $process = Start-Process -FilePath $exe -ArgumentList "--report", $html -PassThru -NoNewWindow
          if (-not $process.WaitForExit(300000)) {
            $process.Kill()
            throw "report generation timed out"
          }
          if (-not (Test-Path $html)) { throw "report was not written" }

          $content = Get-Content $html -Raw
          foreach ($token in '<svg', 'class="score"', '<footer>', 'class="metric"', '网站延迟') {
            if ($content -notmatch [regex]::Escape($token)) { throw "report is missing: $token" }
          }
          if ($content -match '<script') { throw "report must not contain scripts" }
          $size = (Get-Item $html).Length
          if ($size -lt 4000) { throw "report is suspiciously small: $size bytes" }
          Write-Host "report: $size bytes"

      # Off-screen rendering needs a desktop; keep it best effort so a headless runner cannot
      # block the build. The screenshots are uploaded for review, not diffed: font rasterisation
      # differs between machines, so a pixel gate would fail every run.
      - name: Render screenshots (best effort)
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = "src/AirNet.App/bin/Release/net10.0/AirNet.exe"
          $out = "$env:RUNNER_TEMP/shots"
          $process = Start-Process -FilePath $exe -ArgumentList "--export", $out, "--scale", "1" -PassThru -NoNewWindow
          if (-not $process.WaitForExit(300000)) { $process.Kill(); throw "export timed out" }
          $count = (Get-ChildItem "$out/*.png" -ErrorAction SilentlyContinue).Count
          Write-Host "screenshots: $count"
          if ($count -lt 12) { throw "expected 12 screenshots, got $count" }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-output
          path: |
            ${{ runner.temp }}/selftest.txt
            ${{ runner.temp }}/report.html
            ${{ runner.temp }}/shots
          if-no-files-found: warn
          retention-days: 14

  package:
    name: portable packages
    needs: build-test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Windows keeps R2R; the macOS/Linux cross builds use ReadyToRun=false.
      - name: Build all portable zips
        shell: pwsh
        run: ./packaging/pack-all.ps1

      - name: Upload portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: airnet-portable
          path: |
            artifacts/packages/AirNet-*.zip
            artifacts/packages/AirNet-*.tar.gz
          if-no-files-found: error
          retention-days: 30

      # Only portable archives are attached; no setup/installer is produced or uploaded.
      - name: Attach portable assets to tag release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/packages/AirNet-*.zip
            artifacts/packages/AirNet-*.tar.gz
          fail_on_unmatched_files: true
