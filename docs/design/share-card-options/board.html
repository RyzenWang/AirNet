<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:1800px;height:780px;overflow:hidden;background:#E9E3D8;color:#1D232C;
    font-family:"Segoe UI","Microsoft YaHei UI","Inter",sans-serif}
  .board{padding:34px 42px}
  .head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px}
  h1{font-size:24px;margin:0;letter-spacing:-.5px}
  .sub{font-size:11px;color:#69645C;margin-top:5px}
  .note{font-size:10px;color:#9A9286;text-align:right;line-height:1.6}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .option{background:#FBFAF7;border:1px solid #DED7CB;border-radius:14px;padding:12px;box-shadow:0 12px 30px #2A1E1610}
  .label{display:flex;align-items:center;justify-content:space-between;padding:1px 2px 10px}
  .label b{font-size:13px}
  .label span{font-size:9px;color:#9A9286;letter-spacing:.6px}
  img{display:block;width:100%;height:auto;border-radius:8px;border:1px solid #E7E0D4}
  .desc{font-size:9.5px;line-height:1.5;color:#69645C;margin:9px 2px 0;min-height:28px}
  .tag{font-size:8.5px;color:#A93620;background:#FBE4DD;border-radius:8px;padding:2px 7px}
</style>
</head>
<body>
<div class="board">
  <div class="head">
    <div><h1>AirNet 分享卡片 · 三个方向</h1><div class="sub">同样的数据，不同的信息密度和社交气质</div></div>
    <div class="note">1080 × 1350 · 示例数据<br>场景分数已罗列</div>
  </div>
  <div class="grid">
    <div class="option">
      <div class="label"><b>A · 报告单</b><span>REPORT</span></div>
      <img src="a-report.png">
      <div class="desc">最接近现在的纸面报告：分数、四项指标、五场景横条。稳妥、信息完整。</div>
    </div>
    <div class="option">
      <div class="label"><b>B · 数据面板</b><span>DASHBOARD</span></div>
      <img src="b-dashboard.png">
      <div class="desc">大色块 + 场景卡片，信息密度高，适合展示“每一项都能打几分”。</div>
    </div>
    <div class="option">
      <div class="label"><b>C · 大字海报</b><span>POSTER</span></div>
      <img src="c-poster.png">
      <div class="desc">分数最有冲击力，场景分数压缩成一行，适合发群和社交媒体。</div>
    </div>
  </div>
</div>
</body>
</html>
